<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101f20" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="OblivionDoc — визуальная концепция нового сайта." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OblivionDoc — визуальная концепция</title>
    <script>
      try {
        const saved = localStorage.getItem('obliviondoc-theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
