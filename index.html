<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162e25" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="OblivionDoc — электронный архив образовательной организации: реестр документов, поиск, сроки хранения и история действий. Демонстрационная версия."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OblivionDoc — электронный архив</title>
    <script>
      try {
        const saved = localStorage.getItem("obliviondoc-theme");
        document.documentElement.dataset.theme =
          saved === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
